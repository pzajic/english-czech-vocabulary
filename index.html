<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>English / Czech Vocabulary</h1>
      </header>

      <section class="settings">
        <div class="field-group">
          <label for="sourceLanguage">Source language</label>
          <select id="sourceLanguage">
            <option value="en">English</option>
            <option value="cs">Czech</option>
          </select>
        </div>

        <div class="field-group">
          <label for="targetLanguage">Target language</label>
          <select id="targetLanguage">
            <option value="cs">Czech</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="field-group">
          <label for="wordCount">Number of words</label>
          <input id="wordCount" type="number" min="1" max="50" value="10" />
        </div>
      </section>

      <section class="lessons-panel">
        <h2>Select lessons</h2>
        <div id="lessonList" class="lesson-list"></div>
      </section>

      <div class="actions">
        <button id="generateQuizBtn" class="primary-btn">Generate quiz</button>
      </div>

      <section id="quizSection" class="quiz-section hidden">
        <div id="quizList" class="quiz-list"></div>
        <div class="actions">
          <button id="submitQuizBtn" class="primary-btn">Submit</button>
        </div>
      </section>

      <section id="resultSection" class="result-section hidden">
        <h2>Results</h2>
        <p id="resultSummary"></p>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
